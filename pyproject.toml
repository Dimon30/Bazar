[project]
name = "bazar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.2",
    "mlflow>=3.14.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
bazar = "apps.cli.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "bazar_core*", "bazar_data*", "rank_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
